<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Efforts Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one top bar with six views; every record opens in a right-hand drawer; tables and timelines scroll inside their own frames. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EBEFF5; --line:#D9DFE8; --line-2:#E7EBF1;
  --fg:#121B2D; --fg-2:#46526A; --fg-3:#6B778F;
  --accent:#0A7C77; --accent-fg:#FFFFFF; --accent-soft:#DDF2F0; --accent-line:#A7DAD6;
  --good:#1B7F4B; --good-soft:#DDF3E6; --warn:#955600; --warn-soft:#FBEFD5; --bad:#B42323; --bad-soft:#FBE3E3;
  --c1:#3A6FD8; --c2:#0E8F8A; --c3:#BE7A10; --c4:#B8467A; --c5:#6C7F1D; --c6:#7A58C8; --c7:#52627A; --c8:#C25B2A;
  --shadow:0 10px 36px rgba(18,27,45,.16);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D131E; --surface:#151D2B; --surface-2:#1C2639; --line:#27334A; --line-2:#1F2A3E;
    --fg:#E6EBF3; --fg-2:#AAB5C9; --fg-3:#8190AB;
    --accent:#3CC2B9; --accent-fg:#06201F; --accent-soft:#12383A; --accent-line:#1F5F5E;
    --good:#4CC38A; --good-soft:#12301F; --warn:#E3AE55; --warn-soft:#38290E; --bad:#F28585; --bad-soft:#3A1717;
    --c1:#7FA6F5; --c2:#4FCBC4; --c3:#E6B05A; --c4:#E58AB4; --c5:#A9BF52; --c6:#B49BEF; --c7:#9AA9C0; --c8:#EE9B6E;
    --shadow:0 10px 36px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131E; --surface:#151D2B; --surface-2:#1C2639; --line:#27334A; --line-2:#1F2A3E;
  --fg:#E6EBF3; --fg-2:#AAB5C9; --fg-3:#8190AB;
  --accent:#3CC2B9; --accent-fg:#06201F; --accent-soft:#12383A; --accent-line:#1F5F5E;
  --good:#4CC38A; --good-soft:#12301F; --warn:#E3AE55; --warn-soft:#38290E; --bad:#F28585; --bad-soft:#3A1717;
  --c1:#7FA6F5; --c2:#4FCBC4; --c3:#E6B05A; --c4:#E58AB4; --c5:#A9BF52; --c6:#B49BEF; --c7:#9AA9C0; --c8:#EE9B6E;
  --shadow:0 10px 36px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.shell{max-width:1320px;margin-inline:auto;padding-block:0 72px}
h3{font-size:11px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:500}
[hidden]{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.mark{width:18px;height:18px;border-radius:5px;background:var(--accent);position:relative;display:inline-block}
.mark::after{content:"";position:absolute;inset:5px 4px 5px 4px;border-left:2px solid var(--accent-fg);border-bottom:2px solid var(--accent-fg);transform:rotate(-45deg) translate(1px,-1px)}
.tabs{display:flex;gap:2px;margin-left:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 13px;color:var(--fg-2);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;color:var(--fg-3);margin-left:5px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;padding-bottom:9px}
.people{display:flex;align-items:center}
.people img{width:26px;height:26px;border-radius:50%;border:2px solid var(--bg);margin-left:-7px;background:var(--surface-2)}
.people img:first-child{margin-left:0}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13px;color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.banner{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.banner.err{background:var(--bad-soft);color:var(--bad)}
main{padding-top:22px}

/* shared */
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.avatar{width:20px;height:20px;border-radius:50%;flex:none;background:var(--surface-2)}
.person{display:inline-flex;align-items:center;gap:7px;min-width:0}
.person span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--fg-3)}
.mono{font-family:var(--f-mono);font-size:12px}
.empty{padding:40px 16px;text-align:center;color:var(--fg-2);border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.empty h3{font-family:var(--f-display);font-size:18px;margin-bottom:6px;color:var(--fg);text-transform:none;letter-spacing:0;font-weight:700}
.empty .btn{margin-top:14px}
.cat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);white-space:nowrap}
.cat i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ent{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 8px;font-size:12.5px;cursor:pointer;color:var(--fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent:hover{border-color:var(--accent);color:var(--accent)}
.ent.uni{background:var(--surface-2);border-color:transparent}
.ents{display:flex;flex-wrap:wrap;gap:5px}
.link{color:var(--accent);text-decoration:none;font-weight:500}
.link:hover{text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--fg-2);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin-bottom:16px}
.tools .sp{flex:1}
.ctl{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;min-width:0;max-width:100%}
input.ctl{min-width:170px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--fg-2);white-space:nowrap}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.sech{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sech h2{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em}
.sech .hint{color:var(--fg-3);font-size:12.5px}
.sech .sp{flex:1}
.meter{display:inline-flex;gap:2px;align-items:flex-end}
.meter i{display:block;width:4px;height:10px;border-radius:1px;background:var(--line)}
.meter i.on{background:var(--accent)}
.rbar{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;min-width:60px}
.rbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.rbar.done i{background:var(--good)}

/* status selects */
.ts{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background-color:var(--surface);border-radius:999px;padding:3px 22px 3px 10px;font-size:12.5px;font-weight:500;cursor:pointer;max-width:150px;min-width:0;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 8px) 55%;background-size:4px 4px,4px 4px;background-repeat:no-repeat;color:var(--fg-2)}
.ts.none{background-color:var(--surface-2);border-color:transparent}
.ts.prog{background-color:var(--accent-soft);color:var(--accent);border-color:transparent}
.ts.done{background-color:var(--good-soft);color:var(--good);border-color:transparent}
.ts.bad{background-color:var(--bad-soft);color:var(--bad);border-color:transparent}
.ts.na{background-color:transparent;border-style:dashed;color:var(--fg-3)}
.ts[disabled]{cursor:default;opacity:.85}
.ts.owner{background-color:var(--surface);color:var(--fg);max-width:130px}

/* overview */
.stats{display:flex;flex-wrap:wrap;gap:10px 30px;margin-bottom:22px;align-items:baseline}
.stat{display:flex;align-items:baseline;gap:8px}
.stat b{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{color:var(--fg-2);font-size:13px}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.good b{color:var(--good)}
.ovgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.fun{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 14px;align-items:center}
.fun .lbl{font-weight:500;font-size:13px;cursor:pointer;background:none;border:0;text-align:left;padding:0}
.fun .lbl:hover{color:var(--accent)}
.fbar{display:flex;align-items:center;gap:10px;min-width:0}
.fbar .b{height:22px;border-radius:5px;background:var(--accent);min-width:3px;flex:none;display:flex;align-items:center;padding-inline:8px;color:var(--accent-fg);font-weight:600;font-size:12px}
.fbar .b.zero{background:var(--line-2);color:var(--fg-3);width:22px}
.fbar .ents{flex:1;min-width:0}
.tbars{display:flex;flex-direction:column;gap:12px}
.tb{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 12px;align-items:center;cursor:pointer;background:none;border:0;text-align:left;padding:0;width:100%}
.tb .lbl{font-size:13px;font-weight:500}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line-2)}
.stack i{display:block;height:100%}
.stack .s-done{background:var(--good)} .stack .s-prog{background:var(--accent)} .stack .s-none{background:var(--line)}
.tb .cap{grid-column:2;font-size:12px;color:var(--fg-3)}
.alist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line-2);cursor:pointer}
.alist li:first-child{border-top:0;padding-top:0}
.alist li:hover .t{color:var(--accent)}
.alist .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alist .s{color:var(--fg-3);font-size:12.5px;grid-column:1;min-width:0}
.alist .d{grid-row:1/span 2;grid-column:2;align-self:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-3);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

/* log book */
.tlg{margin-bottom:26px}
.tlh{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.tlh h2{font-family:var(--f-display);font-size:19px}
.tl{position:relative}
.tl::before{content:"";position:absolute;left:96px;top:6px;bottom:6px;width:2px;background:var(--line)}
.mrow{display:grid;grid-template-columns:76px minmax(0,1fr);gap:0 36px;margin-bottom:14px;position:relative}
.mrow::before{content:"";position:absolute;left:91px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.mrow.up::before{border-color:var(--warn)}
.dtb{text-align:right;padding-top:2px}
.dtb b{display:block;font-family:var(--f-display);font-size:26px;line-height:1;letter-spacing:-.02em}
.dtb span{display:block;font-size:12px;color:var(--fg-3);margin-top:3px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.mh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mh .ttl{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--fg)}
.mh .ttl:hover{color:var(--accent)}
.mh .sp{flex:1}
.mnote{white-space:pre-wrap;color:var(--fg);max-width:90ch}
.mnote.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mdec{border-left:3px solid var(--accent-line);padding-left:12px}
.mdec li{padding:1px 0}
.fu{border-top:1px solid var(--line-2);padding-top:8px}
.fu li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:5px 0}
.fu li input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.fu .t{background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.fu .t:hover{color:var(--accent)}
.fu .t.done{text-decoration:line-through;color:var(--fg-3)}
.addfu{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.addfu input[type=text]{flex:1;min-width:160px}
.addfu .ctl{padding:5px 8px;font-size:13px}

/* actionables: calendar */
.calnav{display:flex;align-items:center;gap:8px}
.calnav h2{font-family:var(--f-display);font-size:19px;min-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.cal .dow{padding:8px 10px;background:var(--surface-2);font:500 11px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);border-bottom:1px solid var(--line)}
.day{min-height:116px;padding:6px 6px 8px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);min-width:0;cursor:pointer;position:relative}
.day:nth-child(7n){border-right:0}
.day.out{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.day.out .dn{color:var(--fg-3)}
.day.over{background:var(--accent-soft)}
.dn{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;font-size:12.5px;font-weight:500;border:0;background:none;cursor:pointer;color:var(--fg)}
.day.today .dn{background:var(--accent);color:var(--accent-fg);font-weight:600}
.ca{display:block;width:100%;text-align:left;font-size:12px;padding:2px 6px;border-radius:5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;border-left:3px solid var(--c7);background:var(--surface-2);cursor:pointer;color:var(--fg)}
.ca:hover{filter:brightness(.97);outline:1px solid var(--accent-line)}
.ca.s-prog{background:var(--accent-soft)}
.ca.s-bad{background:var(--bad-soft)}
.ca.s-done{opacity:.55;text-decoration:line-through}
.ca.od{outline:1px solid var(--bad)}
.ca.mt{background:transparent;border:1px dashed var(--fg-3);border-left:3px solid var(--warn);font-weight:500}
.more{font-size:11.5px;color:var(--fg-3);background:none;border:0;cursor:pointer;margin-top:3px;padding:0 4px}
.more:hover{color:var(--accent)}

/* actionables: gantt */
.gwrap{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:auto;max-height:calc(100vh - 260px);position:relative}
.ginner{position:relative}
.ghead{position:sticky;top:0;z-index:6;display:flex;background:var(--surface-2);border-bottom:1px solid var(--line)}
.glab{width:270px;flex:none;position:sticky;left:0;z-index:5;background:var(--surface);border-right:1px solid var(--line);padding:0 12px;display:flex;align-items:center;gap:8px;min-width:0}
.ghead .glab{background:var(--surface-2);align-items:flex-end;padding-bottom:6px;font:500 11px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.gtime{position:relative;flex:none}
.gm,.gw{position:absolute;top:0;height:26px;border-left:1px solid var(--line);padding:4px 6px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;color:var(--fg-2)}
.gw{top:26px;height:22px;font-weight:400;color:var(--fg-3);font-size:11.5px;border-left-color:var(--line-2)}
.grow{display:flex;height:36px;border-bottom:1px solid var(--line-2)}
.grow.gh{background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
.grow.gh .glab{background:color-mix(in srgb,var(--surface-2) 60%,var(--surface));font-weight:600}
.grow .glab .tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--fg)}
.grow .glab .tt:hover{color:var(--accent)}
.grow .gtime{height:36px}
.gbar{position:absolute;top:8px;height:20px;border-radius:5px;background:var(--c7);color:#fff;font-size:12px;display:flex;align-items:center;padding:0 8px;overflow:hidden;white-space:nowrap;cursor:grab;touch-action:none;user-select:none}
.gbar.s-prog{background:var(--accent);color:var(--accent-fg)}
.gbar.s-bad{background:var(--bad);color:#fff}
.gbar.s-done{background:var(--good);opacity:.6;color:#fff}
.gbar.ms{border-radius:50%;width:14px!important;height:14px;top:11px;padding:0}
.gbar .rh{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}
.gbar .rh.l{left:0}.gbar .rh.r{right:0}
.gout{position:absolute;top:10px;font-size:12px;color:var(--fg-2);white-space:nowrap;pointer-events:none}
.gsum{position:absolute;top:14px;height:8px;border-radius:4px;background:var(--fg-3);opacity:.35}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:4;pointer-events:none}
.gtoday::before{content:"Today";position:absolute;top:50px;left:4px;font:500 10px var(--f-mono);color:var(--bad);text-transform:uppercase}
.unsched{margin-top:12px;color:var(--fg-3);font-size:13px}

/* actionables: list */
.agrp{margin-bottom:20px}
.arow{display:grid;grid-template-columns:auto minmax(0,2.2fr) minmax(0,1fr) 140px 120px 110px 96px;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line-2);cursor:pointer}

function trk(l,k){const tr=TRK(k),t=(l.t&&l.t[k])||{};return {s:t.s||tr.def||tr.opts[0],l:t.l||''};}
function effOpts(tr){return tr.na?tr.opts.slice(1):tr.opts;}
function trackTone(tr,s){
  if(tr.na&&s===tr.na)return 'na';
  const eff=effOpts(tr),i=eff.indexOf(s);
  if(i<=0)return 'none'; if(i===eff.length-1)return 'done'; return 'prog';
}
function trackFrac(l,tr){
  const s=trk(l,tr.k).s; if(tr.na&&s===tr.na)return null;
  const eff=effOpts(tr);return Math.max(0,eff.indexOf(s))/(eff.length-1);
}
const prepDone=l=>PREP.filter(p=>l.prep&&l.prep[p[0]]).length;
function trainingOf(l){
  const us=(l.unis||[]).map(id=>get('unis',id)).filter(Boolean);
  const done=us.filter(u=>u.training&&(u.training.status==='Delivered'||u.training.status==='Follow-up done')).length;
  const sched=us.filter(u=>u.training&&(u.training.status==='Scheduled'||u.training.status==='Material pending')).length;
  return {total:us.length,done,sched};
}
function readiness(l){
  const f=[prepDone(l)/PREP.length];
  TRACKS.forEach(t=>{const x=trackFrac(l,t);if(x!=null)f.push(x);});
  const tr=trainingOf(l);f.push(tr.total?tr.done/tr.total:0);
  return f.reduce((a,b)=>a+b,0)/f.length;
}
const actionsOf=pred=>D('actions').filter(pred);
const openActs=lid=>actionsOf(a=>a.lender===lid&&a.status!=='Done').sort(byDue);
function byDue(a,b){
  if(a.due&&b.due)return a.due<b.due?-1:a.due>b.due?1:0;
  if(a.due)return -1; if(b.due)return 1;
  return (b.updatedAt||0)-(a.updatedAt||0);
}
const isOverdue=a=>!!a.due&&a.status!=='Done'&&a.due<todayStr();
function lastTouch(l){
  let t=l.updatedAt||l.createdAt||0;
  D('meetings').forEach(m=>{if((m.lenders||[]).indexOf(l.id)>=0){const x=parseYmd(m.date).getTime();if(x<=Date.now()&&x>t)t=x;}});
  D('actions').forEach(a=>{if(a.lender===l.id&&(a.updatedAt||0)>t)t=a.updatedAt;});
  return t;
}
const isStale=l=>l.hold==='Active'&&l.stage!=='Live'&&Date.now()-lastTouch(l)>14*864e5;
function guessCat(lid){
  const l=get('lenders',lid); if(!l)return 'ops';
  if(l.stage==='Identified'||l.stage==='Preparation')return 'prep';
  if(l.stage==='Proposal'||l.stage==='Negotiation')return 'proposal';
  return 'onboarding';
}

/* ---------- people ---------- */
const nameOf=id=>{const p=S.profiles[id];return (p&&p.name)||'Teammate';};
function ensureProfiles(){
  if(!S.user)return;
  const ids=new Set();
  D('members').forEach(m=>ids.add(m.id));
  D('lenders').forEach(l=>{if(l.owner)ids.add(l.owner);});
  D('actions').forEach(a=>{if(a.owner)ids.add(a.owner);});
  D('events').forEach(e=>{if(e.by)ids.add(e.by);});
  D('meetings').forEach(m=>{if(m.by)ids.add(m.by);});
  const need=Array.from(ids).filter(id=>!S.asked.has(id));
  if(!need.length)return;
  need.forEach(id=>S.asked.add(id));
  S.user.profiles(need).then(ps=>{
    Object.assign(S.profiles,ps);
    if(S.me.id)S.profiles[S.me.id]=Object.assign({},S.profiles[S.me.id]||{},{name:S.me.name||(S.profiles[S.me.id]||{}).name||'',avatarUrl:S.me.avatarUrl});
    scheduleRender();
  });
}
function avatarFor(id,cls){const p=S.profiles[id];return h('img',{class:cls==null?'avatar':cls,alt:'',src:(p&&p.avatarUrl)||null,width:20,height:20});}

/* ---------- writes ---------- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;},2800);}
function fail(e,what){toast("Couldn't "+what+(e&&e.code?' ('+e.code+')':'')+'. Try again.');}
function put(col,data){const ref=S.db.collection(col).doc();return ref.set(data).then(()=>ref.id).catch(e=>{fail(e,'save that');throw e;});}
function upd(col,id,patch){
  if(!S.canWrite)return Promise.resolve();
  const data=Object.assign({},patch,{updatedAt:Date.now(),updatedBy:S.me.id||''});
  return queue(col+'/'+id,()=>S.db.doc(col+'/'+id).update(data)).catch(e=>fail(e,'save the change'));
}
function remove(col,id){return S.db.doc(col+'/'+id).delete().catch(e=>fail(e,'delete that'));}
function evt(l,kind,text){
  const lid=typeof l==='string'?l:l.id,lo=get('lenders',lid);
  return S.db.collection('events').add({lender:lid,lname:lo?lo.name:'',kind,text,by:S.me.id||'',at:Date.now()}).catch(()=>{});
}
function setLender(id,patch){
  const l=get('lenders',id);if(!l)return;
  const ev=[];
  if(patch.stage&&patch.stage!==l.stage)ev.push(['stage',l.stage+' → '+patch.stage]);
  if(patch.hold&&patch.hold!==l.hold)ev.push(['hold',l.hold+' → '+patch.hold]);
  return upd('lenders',id,patch).then(()=>ev.forEach(e=>evt(l,e[0],e[1])));
}
function setTrack(id,k,patch){
  const l=get('lenders',id),tr=TRK(k);if(!l)return;
  const cur=trk(l,k),t={};
  if('s' in patch)t.s=patch.s; if('l' in patch)t.l=patch.l;
  return upd('lenders',id,{t:{[k]:t}}).then(()=>{if('s' in patch&&patch.s!==cur.s)evt(l,'track',tr.label+': '+cur.s+' → '+patch.s);});
}
function addLender(data){
  const now=Date.now(),t={};
  TRACKS.forEach(tr=>{t[tr.k]={s:tr.def||tr.opts[0],l:''};});
  return put('lenders',Object.assign({name:'',market:'',kind:'Offshore',stage:'Identified',hold:'Active',owner:S.me.id||'',contact:'',unis:[],excluded:[],prep:{meeting:false,drive:false,list:false},driveLink:'',t,notes:'',createdAt:now,updatedAt:now,updatedBy:S.me.id||''},data))
    .then(id=>{evt(id,'created','Added to the pipeline');return id;});
}
function addAction(data){
  const now=Date.now();
  return put('actions',Object.assign({title:'',desc:'',status:'To do',prio:'Medium',cat:'ops',owner:S.me.id||'',start:'',due:'',lender:'',uni:'',meeting:'',createdAt:now,updatedAt:now,updatedBy:S.me.id||'',doneAt:0},data));
}
function setAction(id,patch){
  const p=Object.assign({},patch);

/* ---------- subscriptions ---------- */
function start(){
  const onErr=e=>{S.err='Could not load the shared data'+(e&&e.code?' ('+e.code+')':'')+'. Reload the page to try again.';scheduleRender();};
  COLS.forEach(c=>{
    let q=S.db.collection(c);
    if(c==='events')q=q.orderBy('at','desc').limit(500);
    q.onSnapshot(snap=>{
      S.d[c]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
      const m={};S.d[c].forEach(x=>{m[x.id]=x;});S.m[c]=m;
      S.loaded[c]=true;
      if(c==='members'&&S.me.id&&S.canWrite&&!S.registering&&!m[S.me.id]){
        S.registering=true;
        S.db.doc('members/'+S.me.id).set({joinedAt:Date.now()}).catch(()=>{S.registering=false;});
      }
      scheduleRender();
    },onErr);
  });
}
const ready=()=>COLS.every(c=>S.loaded[c]);

/* ---------- popover ---------- */
const POP={anchor:null,key:null,build:null};
const popOpen=()=>!$('#pop').hidden;
function placePop(){
  const el=$('#pop');if(!POP.anchor)return;
  const r=POP.anchor.getBoundingClientRect(),w=el.offsetWidth,hh=el.offsetHeight;
  let left=Math.min(Math.max(8,r.left),window.innerWidth-w-8);
  let top=r.bottom+6; if(top+hh>window.innerHeight-8)top=Math.max(8,r.top-hh-6);
  el.style.left=left+'px';el.style.top=top+'px';
}
function openPop(anchor,build){
  const el=$('#pop');POP.anchor=anchor;POP.key=anchor.getAttribute('data-pk');POP.build=build;
  el.hidden=false;el.replaceChildren(build());placePop();
}
function closePop(){const el=$('#pop');if(el.hidden)return;el.hidden=true;el.replaceChildren();POP.anchor=null;POP.key=null;POP.build=null;if(S.pending)scheduleRender();}
function refreshPop(){
  if(!popOpen())return;
  const a=POP.key&&document.querySelector('[data-pk="'+POP.key+'"]');
  if(!a){closePop();return;}
  POP.anchor=a;
  const el=$('#pop');
  if(!el.contains(document.activeElement))el.replaceChildren(POP.build());
  placePop();
}
document.addEventListener('mousedown',e=>{if(popOpen()&&!$('#pop').contains(e.target)&&!(POP.anchor&&POP.anchor.contains(e.target)))closePop();});
window.addEventListener('resize',()=>{if(popOpen())placePop();});

const pill=(t,c)=>h('span',{class:'pill'+(c?' '+c:''),text:t});
const catIdx=k=>Math.max(0,CATS.findIndex(c=>c[0]===k))+1;
function catTag(k){const c=CATS.find(x=>x[0]===k);if(!c)return null;return h('span',{class:'cat'},h('i',{style:'background:var(--c'+catIdx(k)+')'}),c[1]);}
function dueChip(a){
  const due=a.due; if(!due)return h('span',{class:'pill',text:'No date'});
  if(a.status==='Done')return h('span',{class:'pill',text:fmtShort(due)});
  const d=diffDays(todayStr(),due);

  if(d===0)return pill('Due today','warn');
  if(d<=3)return pill('In '+d+' d','warn');
  return pill(fmtShort(due));
}
function lenderChip(id){const l=get('lenders',id);if(!l)return null;return h('button',{class:'ent',type:'button',onclick:e=>{e.stopPropagation();openPanel({type:'lender',id});}},l.name||'Untitled lender');}

/* multi-select field: chips plus an add button that opens a checkbox popover */
function msField(o){
  const key=o.key;
  const wrap=h('div',{class:'msf'});
  const draw=()=>{
    wrap.replaceChildren();
    const sel=o.get();
    sel.forEach(id=>{const it=o.items().find(x=>x.id===id);if(!it)return;
      wrap.append(h('span',{class:'ent'+(o.cls?' '+o.cls:'')},it.name,o.disabled?null:h('button',{class:'rm',type:'button','aria-label':'Remove '+it.name,onclick:()=>{o.set(o.get().filter(x=>x!==id));draw();}},'×')));});
    if(!o.disabled){
      const add=h('button',{class:'add',type:'button','data-pk':key,onclick:()=>openPop(add,()=>{
        const box=h('div',{class:'pk'});
        const its=o.items();
        if(!its.length)box.append(h('div',{class:'hd',text:o.empty||'Nothing to pick yet'}));
        its.forEach(it=>{
          const cb=h('input',{type:'checkbox',checked:o.get().indexOf(it.id)>=0});
          cb.addEventListener('change',()=>{const cur=o.get();o.set(cb.checked?uniq(cur.concat([it.id])):cur.filter(x=>x!==id_(it)));draw();});
          box.append(h('label',{},cb,it.name,it.sub?h('span',{class:'muted',style:'margin-left:auto;font-size:12px',text:it.sub}):null));
        });
        if(o.onNew)box.append(h('button',{class:'mi',type:'button',onclick:()=>{closePop();o.onNew();}},'+ '+o.newLabel));
        return box;
      })},'+ '+(o.addLabel||'Add'));
      wrap.append(add);
    }
  };
  const id_=it=>it.id;
  draw();
  return wrap;
}
/* ---------- render infrastructure ---------- */
const VIEWS=[['overview','Overview'],['logbook','Log book'],['actions','Actionables'],['lenders','Lenders'],['unis','Universities'],['report','Report']];
S.scr={};S.after=[];S.refresh=null;
let rafId=0;
function scheduleRender(){cancelAnimationFrame(rafId);rafId=requestAnimationFrame(doRender);}
function editingInView(){const a=document.activeElement;return !!a&&$('#view').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);}
function doRender(){
  if(S.dragging){S.pending=true;return;}
  if(editingInView()){S.pending=true;renderChrome();return;}
  render();
}
document.addEventListener('focusout',()=>{if(S.pending)setTimeout(()=>{if(S.pending&&!editingInView()&&!S.dragging)render();},0);});
function go(v){S.view=v;S.refresh=null;render();window.scrollTo(0,0);}
function buildTabs(){
  const nav=$('#tabs');nav.replaceChildren();
  VIEWS.forEach(v=>nav.append(h('button',{class:'tab',role:'tab',id:'tab-'+v[0],'data-view':v[0],onclick:()=>go(v[0])},v[1],h('span',{class:'n'}))));
}
function renderChrome(){
  const cnt={logbook:D('meetings').length,actions:D('actions').filter(a=>a.status!=='Done').length,lenders:D('lenders').filter(l=>l.hold!=='Dropped').length,unis:D('unis').length};
  $$('.tab').forEach(t=>{t.setAttribute('aria-selected',t.dataset.view===S.view?'true':'false');const n=$('.n',t);if(n)n.textContent=cnt[t.dataset.view]!=null&&ready()?cnt[t.dataset.view]:'';});
  const pe=$('#people');pe.replaceChildren();

  if(S.err)b.append(h('div',{class:'banner err',text:S.err}));
  else if(!S.canWrite)b.append(h('div',{class:'banner',text:'You can view the tracker but not change it. Ask the owner to share it with you as a Contributor or Editor.'}));

}
function render(){
  S.pending=false;
  renderChrome();
  if(!ready())return;
  const v=$('#view');
  $$('[data-scroll]',v).forEach(el=>{S.scr[el.dataset.scroll]=[el.scrollLeft,el.scrollTop];});
  S.after=[];
  const fn={overview:viewOverview,logbook:viewLogbook,actions:viewActions,lenders:viewLenders,unis:viewUnis,report:viewReport}[S.view]||viewOverview;

  $$('[data-scroll]',v).forEach(el=>{const p=S.scr[el.dataset.scroll];if(p){el.scrollLeft=p[0];el.scrollTop=p[1];}});
  S.after.forEach(f=>f());
  $$('.autosize',v).forEach(fit);
  ensureProfiles();

  const dr=$('#drawer');
  if(S.panel&&!dr.contains(document.activeElement)&&!popOpen())renderDrawer();

}

function sel(opts,cur,fn,label){return h('select',{class:'ctl','aria-label':label,onchange:e=>fn(e.target.value)},opts.map(o=>h('option',{value:o[0],text:o[1],selected:o[0]===cur})));}

/* ---------- overview ---------- */
function viewOverview(){
  const L=D('lenders').filter(l=>l.hold!=='Dropped');
  const open=D('actions').filter(a=>a.status!=='Done');
  const od=open.filter(isOverdue),blocked=open.filter(a=>a.status==='Blocked');
  const today=todayStr(),since=addDays(today,-30);
  const mtgs=D('meetings').filter(m=>m.date>=since&&m.date<=today).length;
  const progs=D('programs').length;
  const stat=(n,l,c)=>h('div',{class:'stat '+(c&&n>0?c:'')},h('b',{text:n}),h('span',{text:l}));
  const wrap=h('div');
  wrap.append(h('div',{class:'stats'},
    stat(L.length,'lenders in play'),stat(L.filter(l=>l.stage==='Live').length,'live','good'),
    stat(D('unis').length,'universities'),stat(progs,'programs mapped'),
    stat(open.length,'open actionables'),stat(od.length,'overdue','bad'),stat(blocked.length,'blocked','warn'),stat(mtgs,'meetings, last 30 days')));
  const left=h('div',{class:'col'}),right=h('div',{class:'col'});

  /* funnel */
  const fc=h('div',{class:'card'});
  fc.append(cardH('Where the pipeline stands',L.length+' lender'+(L.length===1?'':'s')+' · on hold or dropped are not counted as moving'));
  if(!D('lenders').length)fc.append(emptyState('No lenders yet','Add the lenders you are onboarding and each one lands in the pipeline.','Add a lender',()=>openPanel({type:'newLender'})));
  else{
    const fun=h('div',{class:'fun'});
    const max=Math.max(1,...STAGES.map(s=>L.filter(l=>l.stage===s&&l.hold==='Active').length));
    STAGES.forEach(s=>{
      const ls=L.filter(l=>l.stage===s);
      const act=ls.filter(l=>l.hold==='Active').length;
      fun.append(h('button',{class:'lbl',type:'button',onclick:()=>{S.lstage=s;S.lview='table';go('lenders');}},s));
      const bar=h('div',{class:'fbar'},h('span',{class:'b'+(ls.length?'':' zero'),style:'width:'+(ls.length?Math.max(26,Math.round(act/max*150)):22)+'px',text:ls.length||'0'}));
      const ents=h('div',{class:'ents'});ls.slice(0,5).forEach(l=>ents.append(lenderChip(l.id)));
      if(ls.length>5)ents.append(h('span',{class:'muted',text:'+'+(ls.length-5)+' more'}));
      bar.append(ents);fun.append(bar);
    });
    fc.append(fun);
  }
  left.append(fc);

  /* readiness by track */
  const rc=h('div',{class:'card'});
  rc.append(cardH('Readiness by workstream','Across lenders in play. Click a row to open the lender table.'));
  if(!L.length)rc.append(h('p',{class:'muted',text:'Appears once lenders are added.'}));
  else{
    const rows=[];
    rows.push({label:'Preparation',f:l=>{const d=prepDone(l);return d===PREP.length?'done':d>0?'prog':'none';}});
    TRACKS.forEach(tr=>rows.push({label:tr.short||tr.label,f:l=>{const t=trk(l,tr.k).s;return trackTone(tr,t);},na:true}));
    rows.push({label:'Training',f:l=>{const t=trainingOf(l);return t.total&&t.done===t.total?'done':(t.done||t.sched)?'prog':'none';}});
    const tb=h('div',{class:'tbars'});
    rows.forEach(r=>{
      const c={done:0,prog:0,none:0,na:0};L.forEach(l=>{c[r.f(l)]++;});
      const tot=L.length-c.na;
      const st=h('div',{class:'stack','aria-hidden':'true'});
      ['done','prog','none'].forEach(k=>{if(c[k])st.append(h('i',{class:'s-'+k,style:'width:'+(tot?c[k]/tot*100:0)+'%'}));});
      tb.append(h('button',{class:'tb',type:'button',onclick:()=>{S.lview='table';go('lenders');}},
        h('span',{class:'lbl',text:r.label}),st,
        h('span',{class:'cap',text:c.done+' done · '+c.prog+' in progress · '+c.none+' not started'+(c.na?' · '+c.na+' not needed':'')})));
    });
    rc.append(tb,h('div',{class:'legend'},h('span',{},h('i',{style:'background:var(--good)'}),'Done'),h('span',{},h('i',{style:'background:var(--accent)'}),'In progress'),h('span',{},h('i',{style:'background:var(--line)'}),'Not started')));
  }
  left.append(rc);

  /* attention */
  const items=[];
  od.sort(byDue).forEach(a=>items.push({t:a.title,s:'Overdue · '+(a.lender&&get('lenders',a.lender)?get('lenders',a.lender).name+' · ':'')+(a.owner?nameOf(a.owner):'Unassigned'),d:dueChip(a),fn:()=>openPanel({type:'action',id:a.id})}));
  blocked.forEach(a=>items.push({t:a.title,s:'Blocked · '+(a.lender&&get('lenders',a.lender)?get('lenders',a.lender).name:'No lender linked'),d:pill('Blocked','bad'),fn:()=>openPanel({type:'action',id:a.id})}));

/* timeline (gantt) */
function ganttBody(){
  const all=filteredActions(),today=todayStr();
  const sched=all.filter(a=>a.start||a.due),unsched=all.filter(a=>!a.start&&!a.due);
  const wrap=h('div');
  if(!sched.length){
    wrap.append(emptyState('Nothing to plot yet','Give an actionable a start and due date and it appears here as a bar. Drag a bar to reschedule it.'));
    if(unsched.length)wrap.append(h('p',{class:'unsched',text:unsched.length+' actionable'+(unsched.length===1?' has':'s have')+' no dates yet.'}));
    return wrap;
  }
  let lo=addDays(today,-14),hi=addDays(today,42);
  sched.forEach(a=>{const s=a.start||a.due,e=a.due||a.start;if(s<lo)lo=s;if(e>hi)hi=e;});
  lo=mondayOf(lo);hi=addDays(mondayOf(hi),13);
  const dw=S.gScale,n=diffDays(lo,hi)+1,W=n*dw,LAB=270;
  const X=s=>diffDays(lo,s)*dw;
  const inner=h('div',{class:'ginner',style:'width:'+(LAB+W)+'px'});
  /* header */
  const gt=h('div',{class:'gtime',style:'width:'+W+'px;height:48px'});
  let d=lo;
  while(d<=hi){
    const dd=parseYmd(d),mEnd=ymd(new Date(dd.getFullYear(),dd.getMonth()+1,0)),end=mEnd<hi?mEnd:hi;
    const wd=(diffDays(d,end)+1)*dw;
    gt.append(h('div',{class:'gm',style:'left:'+X(d)+'px;width:'+wd+'px',text:dd.toLocaleDateString('en-GB',{month:wd>110?'long':'short',year:wd>150?'numeric':undefined})}));
    d=addDays(end,1);
  }
  for(let k=0;k<n/7;k++){const wd=addDays(lo,k*7);gt.append(h('div',{class:'gw',style:'left:'+(k*7*dw)+'px;width:'+(7*dw)+'px',text:dw>=18?fmtShort(wd):parseYmd(wd).getDate()}));}
  inner.append(h('div',{class:'ghead'},h('div',{class:'glab',style:'height:48px',text:'Actionable'}),gt));
  /* groups */
  const groups=[];const gmap={};
  const keyOf=a=>{
    if(S.gGroup==='lender'){const l=get('lenders',a.lender);return [a.lender||'_',l?l.name:'No lender linked',l?()=>openPanel({type:'lender',id:l.id}):null];}
    if(S.gGroup==='cat'){const c=CATS.find(x=>x[0]===a.cat);return [a.cat||'_',c?c[1]:'Other',null];}
    if(S.gGroup==='owner')return [a.owner||'_',a.owner?nameOf(a.owner):'Unassigned',null];
    return ['all','All actionables',null];
  };
  sched.forEach(a=>{const [k,label,fn]=keyOf(a);if(!gmap[k]){gmap[k]={k,label,fn,items:[]};groups.push(gmap[k]);}gmap[k].items.push(a);});
  const ord=S.gGroup==='cat'?(g=>CATS.findIndex(c=>c[0]===g.k)):null;
  groups.sort((a,b)=>ord?(ord(a)-ord(b)):(a.k==='_'?1:b.k==='_'?-1:String(a.label).localeCompare(String(b.label))));
  const gridBg='background-image:linear-gradient(to right,var(--line-2) 1px,transparent 1px);background-size:'+(7*dw)+'px 100%;';
  const rows=h('div');
  const place=(a)=>{const s=a.start||a.due,e=a.due||a.start,single=!(a.start&&a.due);return {s,e,single};};
  groups.forEach(g=>{
    if(S.gGroup!=='none'){
      const mn=g.items.reduce((m,a)=>{const s=a.start||a.due;return s<m?s:m;},'9999-12-31'),mx=g.items.reduce((m,a)=>{const e=a.due||a.start;return e>m?e:m;},'0000-01-01');
      const lab=h('div',{class:'glab'},g.fn?h('button',{class:'tt',type:'button',onclick:g.fn,style:'font-weight:700'},g.label):h('span',{class:'tt',style:'font-weight:700',text:g.label}),h('span',{class:'mono muted',text:g.items.length}));
      const tm=h('div',{class:'gtime',style:'width:'+W+'px;'+gridBg},h('div',{class:'gsum',style:'left:'+X(mn)+'px;width:'+Math.max(8,(diffDays(mn,mx)+1)*dw)+'px'}));
      rows.append(h('div',{class:'grow gh'},lab,tm));
    }
    g.items.slice().sort((a,b)=>(a.start||a.due)<(b.start||b.due)?-1:1).forEach(a=>{
      const {s,e,single}=place(a);

        const x0=ev.clientX;let moved=false,dd2=0;

          const dx=m2.clientX-x0;if(Math.abs(dx)>3)moved=true;dd2=Math.round(dx/dw);

          if(mode==='move'){ns=addDays(s,dd2);ne=addDays(e,dd2);}
          else if(mode==='l'){ns=addDays(s,dd2);if(ns>e)ns=e;}
          else{ne=addDays(e,dd2);if(ne<s)ne=s;}
          cur=[ns,ne];const gg=geo(ns,ne);
          bar.style.left=gg.left+'px';bar.style.width=gg.width+'px';
          if(out)out.style.left=(gg.left+gg.width+8)+'px';
        };
        const up=()=>{
          bar.removeEventListener('pointermove',mv);bar.removeEventListener('pointerup',up);bar.removeEventListener('pointercancel',up);
          S.dragging=false;
          if(moved){
            S.suppressClick=true;setTimeout(()=>{S.suppressClick=false;},50);
            const patch={};
            if(a.start&&a.due){patch.start=cur[0];patch.due=cur[1];}
            else if(a.due)patch.due=cur[0];else patch.start=cur[0];
            if(patch.start!==a.start||patch.due!==a.due)setAction(a.id,patch);

          if(S.pending)scheduleRender();
        };
        bar.addEventListener('pointermove',mv);bar.addEventListener('pointerup',up);bar.addEventListener('pointercancel',up);
      });
      tm.append(bar);if(out)tm.append(out);
      rows.append(h('div',{class:'grow'},lab,tm));
    });
  });

/* ---------- universities and programs ---------- */
function parsePrograms(text){
  const out=[];
  lines(text).forEach(line=>{
    let name=line,level='',fee=null;
    if(line.indexOf('\t')>=0){
      const p=line.split('\t').map(x=>x.trim());name=p[0];
      p.slice(1).forEach(x=>{if(!x)return;if(/\d/.test(x)&&fee==null){const n=parseFloat(x.replace(/[^0-9.]/g,''));if(isFinite(n))fee=n;}else level=x;});
    }else{
      const m=line.match(/^(.*?)[,;|]\s*(?:([A-Za-z]+)\s*[,;|]\s*)?[£$€₹]?\s*(\d[\d,]*\.?\d*)\s*$/);
      if(m){name=m[1].trim();level=m[2]||'';fee=parseFloat(m[3].replace(/,/g,''));}
    }
    if(!name)return;
    const lv=level.toLowerCase();
    const lvl=!lv?'':/^(ug|under|bach)/.test(lv)?'Undergraduate':/^(pg|post|mast|msc|mba|llm)/.test(lv)?'Postgraduate':/^found/.test(lv)?'Foundation':'Other';
    out.push({name,level:lvl,fee});
  });
  return out;
}

  const unames=(m.unis||[]).map(id=>(get('unis',id)||{}).name).filter(Boolean).join(', ')||'none';
  const prompt='You help a partnerships team keep a meeting log. Read the raw meeting notes and reply with ONLY a JSON object of this shape:\n'+
    '{"summary":"3 to 6 sentences in the past tense","decisions":["each decision that was agreed"],"actions":[{"title":"short imperative follow-up","due":"YYYY-MM-DD, or empty string if no date was given","category":"one of prep, proposal, onboarding, material, training, digital, ops, aveka","owner_hint":"a first name mentioned for this follow-up, or empty string"}]}\n'+

    const lid=(m.lenders||[])[0]||'';
    const acts=(Array.isArray(out&&out.actions)?out.actions:[]).map(a=>({title:String(a&&a.title||'').trim(),due:/^\d{4}-\d{2}-\d{2}$/.test(String(a&&a.due||''))?a.due:'',cat:CATS.some(c=>c[0]===(a&&a.category))?a.category:guessCat(lid),owner_hint:String(a&&a.owner_hint||'').trim()})).filter(a=>a.title);
    S.extract={mid,loading:false,sel:{},res:{summary:String(out&&out.summary||'').trim(),decisions:(Array.isArray(out&&out.decisions)?out.decisions:[]).map(x=>String(x).trim()).filter(Boolean),actions:acts}};
  }catch(e){
    const c=e&&e.code;
    S.extract={mid,loading:false,err:c==='cancelled'?'':c==='not_granted'||c==='sampling_disabled'?'Claude is not available to this page for your account.':c==='rate_limited'?'Too many requests right now. Try again in a minute.':c==='invalid_json'?'Claude replied in a format the page could not read. Try again.':'That did not work. Try again.'};
  }
  if(S.panel&&S.panel.type==='meeting'&&S.panel.id===mid)renderDrawer();
}
function applyExtract(mid){
  const ex=S.extract;if(!ex||ex.mid!==mid||!ex.res)return;
  const m=get('meetings',mid),r=ex.res,patch={};
  if(r.summary)patch.summary=r.summary;
  if(r.decisions.length)patch.decisions=r.decisions.join('\n');
  if(Object.keys(patch).length)upd('meetings',mid,patch);
  const lid=(m.lenders||[])[0]||'';let n=0;
  r.actions.forEach((a,i)=>{
    if(ex.sel[i]===false)return;n++;
    const hint=a.owner_hint.toLowerCase();
    const mem=hint?D('members').find(x=>nameOf(x.id).toLowerCase().split(' ')[0]===hint.split(' ')[0]):null;
    addAction({title:a.title,due:a.due,cat:a.cat,lender:lid,meeting:mid,owner:mem?mem.id:''});
  });
  S.extract=null;toast('Saved'+(n?' with '+n+' follow-up'+(n===1?'':'s'):''));
  renderDrawer();
}
function newMeetingPanel(p){
  let lenders=p.lender?[p.lender]:(S.mlender!=='all'?[S.mlender]:[]),unis=[];
  const dt=h('input',{id:'nm-date',type:'date',value:p.date||todayStr()}),tm=h('input',{id:'nm-time',type:'time'});
  const ti=h('input',{id:'nm-title',placeholder:'e.g. Intro call with a lender','data-autofocus':'1'});
  const ty=h('select',{id:'nm-type'},MTYPES.map(x=>h('option',{value:x,text:x})));
  const at=h('input',{id:'nm-att',placeholder:'Names from the lender, university and our team'});
  const nt=h('textarea',{id:'nm-notes',class:'tall',placeholder:'Paste raw notes or write them up. You can have Claude pull out the summary and follow-ups afterwards.'});
  const lf=msField({key:'ms:nm-l',items:lenderItems,get:()=>lenders,set:v=>{lenders=v;},addLabel:'Add lender',empty:'No lenders yet'});
  const uf=msField({key:'ms:nm-u',items:uniItems,get:()=>unis,set:v=>{unis=v;},addLabel:'Add university',cls:'uni',empty:'No universities yet'});
  const create=async(extract)=>{
    if(!ti.value.trim()){ti.focus();return;}
    const now=Date.now();
    try{
      const id=await put('meetings',{title:ti.value.trim(),date:dt.value||todayStr(),time:tm.value,type:ty.value,lenders,unis,attendees:at.value.trim(),notes:nt.value.trim(),summary:'',decisions:'',by:S.me.id||'',createdAt:now,updatedAt:now,updatedBy:S.me.id||''});
      lenders.forEach(l=>evt(l,'meeting','Meeting: '+ti.value.trim()));
      openPanel({type:'meeting',id});
      if(extract&&nt.value.trim())setTimeout(()=>extractFrom(id),50);
    }catch(e){}
  };
  const canAI=S.sample&&typeof S.sample.json==='function';
  return [drawerTop('Log a meeting'),h('div',{class:'dform'},field('Meeting',ti,'nm-title'),h('div',{class:'three'},field('Date',dt,'nm-date'),field('Time',tm,'nm-time'),field('Type',ty,'nm-type')),
    h('div',{class:'f'},h('span',{class:'lbl',text:'Lenders'}),lf),h('div',{class:'f'},h('span',{class:'lbl',text:'Universities'}),uf),field('Who attended',at,'nm-att'),field('What was discussed',nt,'nm-notes'),
    h('div',{class:'dactions'},h('button',{class:'btn primary',type:'button',onclick:()=>create(false)},'Save meeting'),canAI?h('button',{class:'btn',type:'button',onclick:()=>create(true)},'Save and extract with Claude'):null,h('button',{class:'btn',type:'button',onclick:closePanel},'Cancel')))];
}

/* ---------- new menu ---------- */
function newMenu(){
  return ()=>{
    const box=h('div',{class:'pk'});
    [['Log a meeting',()=>openPanel({type:'newMeeting'})],['New actionable',()=>openPanel({type:'newAction'})],['New lender',()=>openPanel({type:'newLender'})],['New university',()=>openPanel({type:'newUni'})]].forEach(i=>box.append(h('button',{class:'mi',type:'button',onclick:()=>{closePop();i[1]();}},i[0])));
    return box;
  };
}

/* ---------- boot ---------- */
$('#scrim').addEventListener('click',closePanel);
$('#newBtn').addEventListener('click',()=>{if(popOpen()&&POP.key==='new'){closePop();return;}openPop($('#newBtn'),newMenu());});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(popOpen()){closePop();return;}if(S.panel)closePanel();});
(async function boot(){
  buildTabs();
  const c=window.claude;
  const msg=(t,b)=>{$('#view').replaceChildren(h('div',{class:'empty'},h('h3',{text:t}),h('p',{text:b})));};
  if(!c||!c.use){msg('Open this in Claude','The tracker needs to run inside Claude to load and save your team data.');return;}
  const r=await Promise.all([c.use('db'),c.use('user'),c.use('sample'),c.use('downloads')]);
  const db=r[0];
  if(!db){msg('Sign in to open the tracker','The tracker keeps your team data in a shared store, which needs a signed-in viewer.');return;}
  S.db=db;S.user=r[1];S.sample=r[2];S.downloads=r[3];
  if(S.user){
    try{S.me=await S.user.me();}catch(e){}
    try{S.canWrite=(await S.user.can('data.write'))!==false;}catch(e){}
    if(S.me.id)S.profiles[S.me.id]={id:S.me.id,name:S.me.name,avatarUrl:S.me.avatarUrl};
  }
  renderChrome();
  start();
})();
})();
</script>
